name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo. A compromised dependency that executes
# during build/test therefore has no writable token to steal (supply-chain damage control).
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # `npm ci` installs strictly from the lockfile; .npmrc sets ignore-scripts=true, so no
      # dependency lifecycle script runs here (the npm-worm entry point).
      - run: npm ci
      # Advisory only: surface a new high/critical advisory on the next PR without blocking it.
      - name: Audit dependencies (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
      # Verify installed packages match the registry's signed attestations (detects tampering).
      - name: Verify package signatures (non-blocking)
        run: npm audit signatures
        continue-on-error: true
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
