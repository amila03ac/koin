name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Advisory only: surface a new high/critical advisory on the next PR without blocking it.
      - name: Audit dependencies (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
